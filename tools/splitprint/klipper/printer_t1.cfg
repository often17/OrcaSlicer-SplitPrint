# SplitPrint example: board B, gantry T1 (high X side). LS01: 800 x 800 x 800 bed.
#
# Board B: BTT Octopus Pro v1.1 (STM32H723) as USB-to-CAN bridge on its own CAN bus (can1),
# with a BTT EBB CAN board (v1.2) on the T1 toolhead. Board B has no Z motor and no bed:
# those live on board A. Pins come from Klipper's generic-bigtreetech-octopus-pro-v1.1.cfg and
# sample-bigtreetech-ebb-canbus-v1.2.cfg. Check every pin, direction and rotation_distance
# against your wiring before the first move.
#
# Run this instance with its own Moonraker (e.g. port 7126) and pass that URL to
# run_dual.py --t1. Never print a head file from this instance on its own.
#
# Both instances must use the same bed coordinates: T1 homes to X max, and position_endstop
# there must put X = 0 at the same physical place as T0's X = 0.
#
# CAN: /etc/network/interfaces.d/can1 on the host, like can0 for board A:
#   allow-hotplug can1
#   iface can1 can static
#       bitrate 1000000
#       up ip link set $IFACE txqueuelen 128

[mcu]
canbus_uuid: 000000000002      # Octopus B, from canbus_query.py can1
canbus_interface: can1

[mcu EBBCan]
canbus_uuid: 000000000003      # EBB on the T1 toolhead
canbus_interface: can1

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100

# X: T1 stays at least split_gantry_min_gap (60 mm on LS01) above T0, which never goes below
# X 0, so T1 never needs X below 60. Klipper cannot see the other gantry.
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: PG6
position_endstop: 800
position_min: 60
position_max: 800
homing_speed: 50

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_endstop: 0
position_max: 800
homing_speed: 50

# Dummy Z: corexy needs a stepper_z, but the real Z motors are on board A. This uses the
# unused Driver3 slot with no motor connected, and an unused endstop input. It is never
# homed: PRINT_START sets its position with SET_KINEMATIC_POSITION. Both head files carry
# the same Z moves, so it follows board A's Z on paper; only board A's moves are real.
[stepper_z]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 8
endstop_pin: PG14              # unused input, nothing connected
position_endstop: 0
position_max: 800

[force_move]
enable_force_move: True

[extruder]
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1
enable_pin: !EBBCan:PD2
microsteps: 16
rotation_distance: 33.500      # calibrate
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan:PA3
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 280

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.650

[fan]
pin: EBBCan:PA0

[heater_fan hotend_fan]
pin: EBBCan:PA1
heater: extruder
heater_temp: 50.0

# The bed heater is on board A. A head file may still set the bed temperature (for example
# after the first layer), so these accept the commands and do nothing.
[gcode_macro M140]
gcode:

[gcode_macro M190]
gcode:

# Moonraker needs these; the slicer writes EXCLUDE_OBJECT_* and M73.
[virtual_sdcard]
path: ~/printer_data_t1/gcodes

[pause_resume]

[display_status]

[exclude_object]

# Called by the LS01 start G-code in each head file:
#   PRINT_START BED_TEMP=<bed> EXTRUDER_TEMP=<this head's nozzle>
# run_dual.py runs this before T0's start G-code: T1 homes X towards X max, away from T0,
# and stays there while board A homes Z and heats the bed.
[gcode_macro PRINT_START]
gcode:
    {% set nozzle = params.EXTRUDER_TEMP|default(200)|float %}
    G28 X Y
    SET_KINEMATIC_POSITION Z=10
    G90
    G1 X780 Y20 F6000
    M109 S{nozzle}

# Moves T1 only towards its own end of the bed (X max), never towards T0.
[gcode_macro PRINT_END]
gcode:
    M400
    M104 S0
    M106 S0
    G91
    G1 E-2 F1800
    G90
    G1 X800 F6000
    M84
