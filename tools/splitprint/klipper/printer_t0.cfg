# SplitPrint example: board A, gantry T0 (low X side). LS01: 800 x 800 x 800 bed.
#
# Board A: BTT Octopus Pro v1.1 (STM32H723) as USB-to-CAN bridge, with a BTT EBB CAN board
# (v1.2) on the T0 toolhead. Board A drives the real Z steppers and the bed heater.
# Pins come from Klipper's generic-bigtreetech-octopus-pro-v1.1.cfg and
# sample-bigtreetech-ebb-canbus-v1.2.cfg. Check every pin, direction and rotation_distance
# against your wiring before the first move.
#
# Run this instance with its own Moonraker (e.g. port 7125) and pass that URL to
# run_dual.py --t0. Never print a head file from this instance on its own: only
# run_dual.py keeps the two gantries apart.
#
# Both instances must use the same bed coordinates: X = 0 at the same physical place for
# both heads. T0 homes to X min, T1 to X max.
#
# CAN: /etc/network/interfaces.d/can0 on the host, as in Klipper's CANBUS docs:
#   allow-hotplug can0
#   iface can0 can static
#       bitrate 1000000
#       up ip link set $IFACE txqueuelen 128

[mcu]
canbus_uuid: 000000000000      # Octopus A, from ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
canbus_interface: can0

[mcu EBBCan]
canbus_uuid: 000000000001      # EBB on the T0 toolhead
canbus_interface: can0

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100

# X: T0 must stay at least split_gantry_min_gap (60 mm on LS01) below T1, which never goes
# below X 60, so T0 never needs X above 740. Keep position_max as tight as the machine allows:
# Klipper cannot see the other gantry, the slicer, check.py and run_dual.py keep them apart.
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: PG6
position_endstop: 0
position_min: 0
position_max: 740
homing_speed: 50

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_endstop: 0
position_max: 800
homing_speed: 50

# The real Z (shared by both heads). Add stepper_z1... for more Z motors.
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: PG10
position_endstop: 0.5
position_max: 800
homing_speed: 10

[extruder]
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1
enable_pin: !EBBCan:PD2
microsteps: 16
rotation_distance: 33.500      # calibrate
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan:PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan:PA3
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 280

[tmc2209 extruder]
uart_pin: EBBCan:PA15
run_current: 0.650

[heater_bed]
heater_pin: PA1
sensor_type: ATC Semitec 104GT-2
sensor_pin: PF3
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: EBBCan:PA0

[heater_fan hotend_fan]
pin: EBBCan:PA1
heater: extruder
heater_temp: 50.0

# Z homes on the low side, where T1 (homed to X 800 first) is far away.
[safe_z_home]
home_xy_position: 200, 400
z_hop: 5

# Moonraker needs these; the slicer writes EXCLUDE_OBJECT_* and M73.
[virtual_sdcard]
path: ~/printer_data_t0/gcodes

[pause_resume]

[display_status]

[exclude_object]

# Called by the LS01 start G-code in each head file:
#   PRINT_START BED_TEMP=<bed> EXTRUDER_TEMP=<this head's nozzle>
# run_dual.py runs T1's start G-code first, so T1 is already homed and parked at X max.
[gcode_macro PRINT_START]
gcode:
    {% set bed = params.BED_TEMP|default(60)|float %}
    {% set nozzle = params.EXTRUDER_TEMP|default(200)|float %}
    M140 S{bed}
    G28
    G90
    G1 Z10 F600
    G1 X20 Y20 F6000
    M190 S{bed}
    M109 S{nozzle}

# Moves T0 only towards its own end of the bed (X min), never towards T1.
[gcode_macro PRINT_END]
gcode:
    M400
    M104 S0
    M140 S0
    M106 S0
    G91
    G1 E-2 F1800
    G1 Z10 F600
    G90
    G1 X0 F6000
    M84
